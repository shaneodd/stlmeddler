name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: these workflows only read this repository's contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned (Dependabot keeps these current); tag pins are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # open3d >= 0.20 dlopens libEGL/libGL at import time; not preinstalled on runners.
      - name: Install system libraries for Open3D
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Lint and type-check are gating; failures break the build.
      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      # Coverage is reported only (no threshold yet); tests must pass.
      - name: Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

  security:
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned (Dependabot keeps these current); tag pins are mutable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install --upgrade pip bandit pip-audit

      # Audits the exact locked dependency set (requirements.lock.txt, hashed)
      # that packaging and reproducible installs use; --no-deps audits each pin
      # directly against PyPA/OSV advisories without re-resolving.
      - name: Dependency audit (pip-audit)
        run: pip-audit --strict --no-deps -r requirements.lock.txt

      # Fails on any finding not explicitly skipped in [tool.bandit].
      - name: Static analysis (bandit)
        run: bandit -c pyproject.toml -r src/
